version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./database.sqlite:/app/database.sqlite
    environment:
      - PORT=3000
      - JWT_SECRET=super-secret-key-123

  frontend:
    build:
      context: ./sandbox
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
